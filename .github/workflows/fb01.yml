name: FB01 verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fb01-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FB01_BROWSER: /tmp/fb01-chrome/chrome-linux64/chrome
      MAP_A_SOFTWARE_GL: '1'
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install-deps chromium
      - name: Install the pinned Chrome for Testing build
        run: |
          curl --fail --location --retry 2 https://storage.googleapis.com/chrome-for-testing-public/155.0.8059.39/linux64/chrome-linux64.zip --output /tmp/fb01-chrome.zip
          echo '55672d1f392fd3e7b7a08621b6e804e6bcb39d40cf155504abb74b3a021ea8ea  /tmp/fb01-chrome.zip' | sha256sum --check
          unzip -q /tmp/fb01-chrome.zip -d /tmp/fb01-chrome
      - name: Install the window manager required for native focus transitions
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y openbox
      - name: Build the tested static image
        run: docker build --iidfile image-id.txt -t fogbound-fb01:ci .
      - name: Serve the same image
        run: docker run -d --name fb01-ci -p 127.0.0.1:4175:80 fogbound-fb01:ci
      - name: Record public build fingerprint
        run: node verification/fingerprint.mjs
      - name: Run browser contracts with virtual display focus changes
        run: xvfb-run --auto-servernum sh -ec 'openbox --version; openbox >/tmp/fb01-openbox.log 2>&1 & wm_pid=$!; sleep 1; kill -0 "$wm_pid"; npm run browser'
        env:
          FB01_HEADED: '1'
      - name: Failure evidence only
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-failure-${{ github.run_id }}
          path: |
            app/verification-output/fingerprint.json
            app/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
